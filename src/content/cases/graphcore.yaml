      overline: Overline. Lorem ipsum dolores
      title: H2. Visual identity, dynamic typeface.
      lead: >-
        Based in Bristol (UK) and Palo Alto (US), Graphcore is a technology
        start-up with the ambitious mission of creating a future where machine
        learning improves all aspects.
  - discriminant: h3
    value:
      title: H3. Based in Bristol (UK)
      text: >-
        Body. And Palo Alto (US), Graphcore is a technology start-up with the
        ambitious mission of creating a future where machine learning improves
        all aspects of our everyday lives. They’ve developed a one of a kind
        Intelligent Processing Unit (IPU) that accelerates machine learning and
        gives experts in the field a platform that’s efficient, flexible and
        dynamic. This piece of hardware will not only empower existing
        start-ups, universities and research labs but will effectively shift and
        shape future sectors and industries.
